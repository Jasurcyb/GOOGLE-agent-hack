{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name | kebabcase }}
  namespace: {{ $.Values.namespaces.agent }}
  labels:
    app: regression-hunter-ai
    component: {{ $name | kebabcase }}
spec:
  {{- if $svc.replicas }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: regression-hunter-ai
      component: {{ $name | kebabcase }}
  template:
    metadata:
      labels:
        app: regression-hunter-ai
        component: {{ $name | kebabcase }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: {{ $.Values.security.nonRoot }}
        readOnlyRootFilesystem: {{ $.Values.security.readOnlyRootFilesystem }}
      containers:
        - name: {{ $name | kebabcase }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $name | kebabcase }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          {{- with $svc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: ENVIRONMENT
              value: {{ $.Values.global.env }}
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rh-secrets
                  key: rabbitmq-url
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: rh-secrets
                  key: postgres-dsn
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: rh-secrets
                  key: redis-url
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
{{- end }}
{{- end }}
