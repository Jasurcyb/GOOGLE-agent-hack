name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Format & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install Python deps
        run: |
          pip install uv
          uv pip install --system ruff mypy pydantic
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy type check
        run: mypy --ignore-missing-imports packages/ apps/
      - name: Install pnpm deps
        working-directory: apps/web
        run: pnpm install --frozen-lockfile || pnpm install
      - name: TypeScript type check
        working-directory: apps/web
        run: npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt jsonschema
      - name: Run contract tests
        run: pytest tests/test_contracts.py -v

  sbom-scan:
    name: SBOM & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements -o sbom.json
      - name: Vulnerability scan
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  image-build:
    name: Build & Sign Images
    runs-on: ubuntu-latest
    needs: [contract-tests, sbom-scan]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/compose/Dockerfile.worker
          push: false
          tags: regression-hunter-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: image-build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: regression_hunter
          POSTGRES_USER: rh
          POSTGRES_PASSWORD: rh_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run integration tests
        env:
          POSTGRES_DSN: postgresql://rh:rh_dev_password@localhost:5432/regression_hunter
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/test_integration.py -v --tb=long

  helm-check:
    name: Helm & Kubernetes Policy Checks
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint infra/helm/regression-hunter-ai/
      - name: Helm template
        run: helm template infra/helm/regression-hunter-ai/ --values infra/helm/regression-hunter-ai/values.yaml > /tmp/rendered.yaml
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64 -o /usr/local/bin/kubeconform
          chmod +x /usr/local/bin/kubeconform
      - name: Validate manifests
        run: kubeconform --strict /tmp/rendered.yaml

