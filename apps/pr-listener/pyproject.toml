[project]
name = "pr-listener"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "celery>=5.4",
    "asyncpg>=0.29",
    "aio-pika>=9.4",
    "contracts",
    "domain",
    "github-adapter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pr_listener"]
