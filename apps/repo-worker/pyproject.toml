[project]
name = "repo-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.4",
    "aio-pika>=9.4",
    "aioboto3>=13.0",
    "pydantic>=2.7",
    "contracts",
    "domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repo_worker"]
