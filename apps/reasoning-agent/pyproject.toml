[project]
name = "reasoning-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "celery>=5.4",
    "aio-pika>=9.4",
    "contracts",
    "domain",
    "llm-gateway",
    "datahub-adapter",
    "observability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reasoning_agent"]
