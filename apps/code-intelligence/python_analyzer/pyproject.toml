[project]
name = "python-analyzer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "libcst>=1.5",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "pydantic>=2.7",
    "contracts",
    "code-graph",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python_analyzer"]
