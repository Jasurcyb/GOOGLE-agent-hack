[project]
name = "impact-analyzer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "networkx>=3.3",
    "celery>=5.4",
    "aio-pika>=9.4",
    "contracts",
    "domain",
    "code-graph",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["impact_analyzer"]
