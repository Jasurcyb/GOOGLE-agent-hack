[project]
name = "publisher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "celery>=5.4",
    "aio-pika>=9.4",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "contracts",
    "domain",
    "github-adapter",
    "datahub-adapter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["publisher"]
