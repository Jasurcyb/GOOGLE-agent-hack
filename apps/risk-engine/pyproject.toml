[project]
name = "risk-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "celery>=5.4",
    "aio-pika>=9.4",
    "numpy>=1.26",
    "contracts",
    "domain",
    "risk-model",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["risk_engine"]
