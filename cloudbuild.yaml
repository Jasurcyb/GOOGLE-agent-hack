steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/regression-hunter-agentic:$COMMIT_SHA', '.']

  # 2. Push the image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/regression-hunter-agentic:$COMMIT_SHA']

  # 3. Deploy to Cloud Run with scale-to-zero settings for cost optimization
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'regression-hunter-agentic'
      - '--image=gcr.io/$PROJECT_ID/regression-hunter-agentic:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--set-env-vars=GEMINI_MODEL=gemini-3.5-flash'

images:
  - 'gcr.io/$PROJECT_ID/regression-hunter-agentic:$COMMIT_SHA'
